# ── Nginx 工作进程配置 ──
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 基础性能调优 ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 200;
    # 附件上传上限 50MB，需与后端 getMaxAttachmentBytes（默认/上限 50MB）保持一致
    client_max_body_size 50m;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/xml+rss;

    # ── 网关级速率限制（每 IP 每秒最多 50 请求） ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # 突发连接限制（每 IP 最多 20 个并发连接）
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream 负载均衡（最少连接算法） ──
    upstream duban_backend {
        least_conn;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    server {
        listen 80;
        server_name your-domain.com;

        root /app/dist;
        index index.html;

        # ── API 反向代理 ──
        location /api/ {
            # 速率限制
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            # 负载均衡
            proxy_pass http://duban_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时控制
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
        }

        # 附件上传：50MB 大文件流式转发（不落盘缓冲），读超时与后端附件路由 180s 对齐
        location /api/attachments/ {
            limit_req zone=api_limit burst=30 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://duban_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 180s;
        }

        # ── 前端静态文件缓存 ──
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── SPA 路由回退 ──
        # index.html / 路由入口不缓存，避免部署后用户继续加载旧入口与旧权限逻辑。
        location / {
            try_files $uri $uri/ /index.html;
            expires off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # ── 安全：禁止访问隐藏文件 ──
        location ~ /\. {
            deny all;
        }

        # ── 安全：禁止下载 sourcemap，防止前端源码还原 ──
        location ~* \.map$ {
            deny all;
        }
    }
}
