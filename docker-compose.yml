version: '3.8'

services:
  # ─── MySQL 数据库 ───
  mysql:
    image: mysql:8.0
    container_name: duban-mysql
    restart: always
    env_file:
      - .env
    volumes:
      # 默认保留现有 named volume；完成迁移后可设为绝对路径，例如 /srv/duban-data/mysql。
      - ${DUBAN_MYSQL_DATA_ROOT:-mysql_data}:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  # ─── 应用服务 ───
  app:
    build: .
    container_name: duban-app
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env

volumes:
  mysql_data:
